name: Web Quality & Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-gps-pc-service:
    name: Verify & Build (gps-pc-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/gps-pc-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/gps-pc-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Build static production site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright layout & E2E tests
        run: npx playwright test
